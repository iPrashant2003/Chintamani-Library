name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag (e.g. v2.8.12)'
        required: false
        default: ''

jobs:
  build-apk:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Build release APKs (split per ABI)
        working-directory: apps/mobile
        run: |
          flutter build apk --split-per-abi --release \
            --no-tree-shake-icons

      - name: Rename APKs
        working-directory: apps/mobile
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          mkdir -p release-apks
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk  "release-apks/Chintamani-Library-${VERSION}-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release-apks/Chintamani-Library-${VERSION}-armeabi.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      "release-apks/Chintamani-Library-${VERSION}-x86_64.apk"
          echo "Built APKs:"
          ls -lh release-apks/

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks-${{ github.ref_name }}
          path: apps/mobile/release-apks/*.apk
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Chintamani Library ${{ github.ref_name }}"
          body: |
            ## Chintamani Library ${{ github.ref_name }}

            ### What's New
            - Payment screenshot verification — screenshots now visible in Admin portal
            - Universal QR portal registration fixed (invalid Prisma invocation resolved)
            - New member registrations stay PENDING until admin approves
            - Seat Matrix: click any available seat to assign a member directly
            - Document Vault: Aadhaar card (front/back) and photo visible in member detail
            - Archive button beside Delete on every member card
            - Loading speed improvements

            ### Download
            Install the APK matching your device architecture:
            - **arm64** — Most modern Android phones (2015+)
            - **armeabi** — Older 32-bit Android phones
            - **x86_64** — Android emulators / Intel tablets
          files: apps/mobile/release-apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
