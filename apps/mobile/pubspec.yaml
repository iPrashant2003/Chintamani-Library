name: chintamani_library
description: Chintamani Library Management System
publish_to: 'none'
version: 2.3.0+25

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  go_router: ^13.2.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.4
  mobile_scanner: ^6.0.0
  qr_flutter: ^4.1.0
  fl_chart: ^0.69.0
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  table_calendar: ^3.1.2
  pdf: ^3.11.1
  printing: ^5.13.2
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  share_plus: ^10.1.4
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.0
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
