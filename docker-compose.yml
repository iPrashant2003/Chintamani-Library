version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chintamani_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-chintamani}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chintamani_secret}
      POSTGRES_DB: ${DB_NAME:-chintamani_library}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chintamani_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-chintamani} -d ${DB_NAME:-chintamani_library}']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: chintamani_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@chintamani.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - '5050:80'
    depends_on:
      - postgres
    networks:
      - chintamani_network

volumes:
  postgres_data:

networks:
  chintamani_network:
    driver: bridge
